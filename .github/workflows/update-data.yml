name: Update NPB data

on:
  schedule:
    # JST 15:40、23:40、00:40（UTC 06:40、14:40、15:40）：白天與夜間比賽結束後更新
    - cron: "40 6 * * *"
    - cron: "40 14 * * *"
    - cron: "40 15 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "要更新的年度，例：current、2025、2015-2025、2020,current"
        default: "current"
        required: true
      force:
        description: "忽略快取全部重抓（一般不需要）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-npb-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Unit tests
        run: cd scraper && python -m unittest -v
      - name: Scrape
        env:
          SEASONS: ${{ github.event.inputs.seasons || 'current' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
        run: python scraper/npb_scraper.py --seasons "$SEASONS" $FORCE
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update NPB data ($(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST'))"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
